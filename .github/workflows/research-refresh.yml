name: Refresh Research Leads

on:
  schedule:
    - cron: "23 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-epstein-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Fetch archive source
        run: |
          mkdir -p .claude/tmp
          git clone --depth 1 https://github.com/epstein-docs/epstein-docs.github.io.git .claude/tmp/epstein-docs.github.io

      - name: Build archive reporting leads
        env:
          SOURCE_DIR: .claude/tmp/epstein-docs.github.io
        run: |
          SOURCE_TIMESTAMP="$(git -C "$SOURCE_DIR" log -1 --format=%cI)"
          python scripts/build_epstein_reporting_leads.py \
            --source "$SOURCE_DIR" \
            --generated-at "$SOURCE_TIMESTAMP"

      - name: Rebuild lead triage ledger
        run: python scripts/build_epstein_lead_triage.py

      - name: Validate generated changes
        run: |
          python scripts/validate_entries.py
          git diff --check

      - name: Publish refreshed research artifacts
        run: |
          if git diff --quiet -- \
            reports/epstein-reporting-leads.json \
            reports/epstein-reporting-summary.md \
            scripts/epstein_lead_triage.json; then
            echo "No research artifact changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/epstein-reporting-leads.json \
            reports/epstein-reporting-summary.md \
            scripts/epstein_lead_triage.json
          git commit -m "chore(research): refresh archive reporting leads"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build live site
        run: npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy live site
        id: deployment
        uses: actions/deploy-pages@v4
