name: Publish Agent Findings

on:
  push:
    branches: [main]
    paths:
      - "data/agent-findings/inbox/**"
      - "scripts/merge_agent_findings.py"
      - "src/pages/updates.astro"
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Merge agent findings
        run: python scripts/merge_agent_findings.py

      - name: Publish generated ledger
        run: |
          if git diff --quiet -- src/data/agent-findings.json; then
            echo "No generated ledger changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/agent-findings.json
          git commit -m "chore(agent-findings): publish daily monitoring ledger"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy live site
        id: deployment
        uses: actions/deploy-pages@v4
